[build]
builder = "dockerfile"
dockerfilePath = "agno_agent_seo_posting/Agent_Railway/backend/Dockerfile"
buildContext = "agno_agent_seo_posting/Agent_Railway/backend"
watchPatterns = ["agno_agent_seo_posting/Agent_Railway/backend/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
